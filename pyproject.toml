[project]
name = "django-xlsx-mail-import"
version = "0.1.0"
description = "A production-style Django management command for idempotent XLSX mailing imports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Igor Nadein" }]
dependencies = [
    "Django>=4.2,<6.0",
    "openpyxl>=3.1,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "gunicorn>=23.0,<24.0",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2,<6.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-django>=4.10,<5.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["mailings/migrations", "mailings/tests"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.setuptools.packages.find]
include = ["config*", "mailings*"]
